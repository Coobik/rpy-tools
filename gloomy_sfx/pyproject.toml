[project]
name = "gloomy-sfx"
version = "0.1.0"
description = "gloomy SFX generator"

authors = [
    {name = "coobik"}
]

requires-python = "~3.15"

[tool.poetry.dependencies]
python = "~3.15"
mypy = "~2.4.0"
pytest = "~9.1.1"
PyYAML = "~6.0.3"
requests = "~2.34.2"
urllib3 = "~2.8.0"
pydantic = "~2.14.1"
pydantic-settings = "~2.15.0"
numpy = "~2.5.4"
scipy = "~1.18.1"

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
